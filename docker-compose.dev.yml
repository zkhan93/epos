services:
  web:
    build: .
    ports:
      - "8088:8080"
    command: ["gunicorn", "-c", "gunicorn.conf.py", "--reload", "wsgi:app"]
    environment:
      - CACHE_DIR=/cache
      - CLEAR_CACHE=False
      - LOG_LEVEL=DEBUG
      - LOG_POLLS=True
    volumes:
      - cache:/cache
      # Source over the top of the image so edits reload without a rebuild.
      - ./app:/app/app
      - ./crawler:/app/crawler
      - ./static:/app/static
      - ./tasks.py:/app/tasks.py
      - ./utils.py:/app/utils.py
      - ./gunicorn.conf.py:/app/gunicorn.conf.py
    restart: unless-stopped

volumes:
  cache:
